[project]
name = "authentication"
version = "0.1.0"
description = "Authentication service for FastAPI App"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apsw>=3.50.2.0",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.115.14",
    "pydantic-settings>=2.10.1",
    "pyjwt[crypto]>=2.10.1",
]

[project.scripts]
run = "Authentication:main"
